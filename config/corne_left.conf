# -------------------------------------------------------------------------
# Corne Left (Central) Configuration
# -------------------------------------------------------------------------

# Split battery reporting (fetches peripheral battery and proxies over BLE)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Split BLE connection parameters between Left (Central) and Right (Peripheral)
# 6 (7.5ms) interval with latency 30 provides 7.5ms keystroke response while
# allowing the peripheral to sleep when idle to conserve battery.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=30
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400
