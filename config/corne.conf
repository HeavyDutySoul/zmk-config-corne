# -------------------------------------------------------------------------
# Power Management & Sleep
# -------------------------------------------------------------------------
# Deep sleep enabled after 30 minutes of inactivity
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Power Management & Soft Off Plus module support
CONFIG_PM_DEVICE=y
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_SOFT_OFF_PLUS_WAKE_DELAY_INIT_PRIORITY=1

# External Power: Required by zmk-soft-off-plus (it references the ext_power
# device node; setting to n causes linker error 'undefined reference to __device_dts_ord_X').
CONFIG_ZMK_EXT_POWER=n

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# -------------------------------------------------------------------------
# USB Settings
# -------------------------------------------------------------------------
# Enable USB HID and Boot protocol for BIOS/UEFI support and ZMK Studio RPC
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y

# -------------------------------------------------------------------------
# Battery Reporting (Global)
# -------------------------------------------------------------------------
# Battery reporting interval (600s = 10 min) saves significant battery over default 60s
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# -------------------------------------------------------------------------
# Bluetooth Settings & Optimizations
# -------------------------------------------------------------------------
# Increase transmit power to +8 dBm for reliable connection between halves and to host
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Advanced BLE features & Connection Parameter Request
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_PARAM_REQ=y

# 251-byte MTU buffers for BLE Data Length Extension (DLE) and fast ZMK Studio syncing
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Experimental BLE stability features (includes overwrite of lost bonds)
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Prevent dropped notifications on Windows hosts
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Low-latency connection interval preferences for responsive typing (7.5ms - 11.25ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
